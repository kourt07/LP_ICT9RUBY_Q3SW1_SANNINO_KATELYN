<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SW1_SANNINO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";; rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



<style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
       
        
        .result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

</style>



</head>
<body>

    <h1>Convert 100 Pesos</h1>
    <button onclick="convertToDollar()">Convert to Dollar</button>
    <button onclick="convertToPound()">Convert to Pound</button>
    
    <div class="result" id="result"></div>

    <script>
        const pesos = 100;
        const dollarRate = 1.70 / 100;  // 100 php
        const poundRate = 1.41 / 100;   // 100 php
        
        function convertToDollar() {
            const result = pesos * dollarRate;  // 100 php x rate of dollar
            document.getElementById('result').textContent = `100 Pesos = ${result.toFixed(2)} Dollars`;
        }

        function convertToPound() {
            const result = pesos * poundRate;  // Multiply 100 Pesos by the rate for Pound
            document.getElementById('result').textContent = `100 Pesos = ${result.toFixed(2)} Pounds`;
        }
    </script>

</body>
</html>
